{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}SkyStore{% endblock %}</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
  {# Подключаем главное меню #}
  {% include 'catalog/menu.html' %}

  <main class="container py-4">
    {% block content %}
    {% endblock %}
  </main>

  <footer class="pt-4 my-md-5 pt-md-5 border-top text-center">
    <small class="d-block mb-3 text-muted">&copy; 2025 SkyStore</small>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
