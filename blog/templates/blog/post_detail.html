{% extends 'catalog/base.html' %}

{% block content %}
  <h1>{{ post.title }}</h1>
  <p class="text-muted">Дата публикации: {{ post.created_at|date:"d.m.Y H:i" }}</p>
  {% if post.preview %}
    <img src="{{ post.preview.url }}" class="img-fluid mb-3" style="max-width: 600px;" alt="Превью">
  {% endif %}
  <div class="mb-3">
    {{ post.content|linebreaks }}
  </div>
  <p>Просмотров: {{ post.views_count }}</p>
  <a class="btn btn-primary" href="{% url 'blog:post_edit' post.pk %}">Редактировать</a>
  <a class="btn btn-danger" href="{% url 'blog:post_delete' post.pk %}">Удалить</a>
  <a class="btn btn-secondary" href="{% url 'blog:post_list' %}">К списку статей</a>
{% endblock %}
