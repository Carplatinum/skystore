{% extends 'catalog/base.html' %}

{% block content %}
  <h1>Удаление статьи</h1>
  <p>Вы действительно хотите удалить статью: <strong>{{ object.title }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a class="btn btn-secondary" href="{% url 'blog:post_detail' object.pk %}">Отмена</a>
  </form>
{% endblock %}
