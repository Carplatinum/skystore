{% extends 'catalog/base.html' %}

{% block content %}
  <h1>
    {% if form.instance.pk %}
      Редактировать статью
    {% else %}
      Добавить статью
    {% endif %}
  </h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a class="btn btn-secondary" href="{% if form.instance.pk %}{% url 'blog:post_detail' form.instance.pk %}{% else %}{% url 'blog:post_list' %}{% endif %}">Отмена</a>
  </form>
{% endblock %}
